name: Build Website ZIP

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r Mumbai-Indians-Website-master.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'Mumbai-Indians-Website-master.zip'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mumbai-Indians-Website-master
          path: Mumbai-Indians-Website-master.zip
          retention-days: 30
