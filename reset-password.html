<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reset your Mumbai Indians fan account password">
<title>Reset Password | Mumbai Indians</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="login-page">
<div class="login-decoration decoration-one"></div>
<div class="login-decoration decoration-two"></div>
<div class="login-container">
<div class="login-brand">
<a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
<div class="login-logo"><img src="images/logo.png" alt="Mumbai Indians Logo"></div>
<p class="brand-tag">#ONEFAMILY</p>
<h1>Reset Password</h1>
<p>Create a new password for your Mumbai Indians account.</p>
</div>
<form class="login-form" id="resetForm">
<div class="input-group">
<label for="password">New Password</label>
<div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" autocomplete="new-password" minlength="8" placeholder="Enter new password" required><button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
</div>
<div class="input-group">
<label for="confirmPassword">Confirm Password</label>
<div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Confirm new password" required><button type="button" class="password-toggle" id="confirmToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
</div>
<div id="resetMessage" class="login-message" aria-live="polite"></div>
<button type="submit" class="login-submit" id="resetSubmit"><span id="buttonText">Update Password</span><i class="fa-solid fa-check" id="buttonIcon"></i></button>
<div class="divider"><span>SECURE ACCOUNT</span></div>
<p class="signup-text"><a href="login.html">Back to Login</a></p>
</form>
</div>
</div>
<script>
const client=window.MIAuth.client;
const form=document.getElementById("resetForm");
const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirmPassword");
const message=document.getElementById("resetMessage");
const submit=document.getElementById("resetSubmit");
const buttonText=document.getElementById("buttonText");
const buttonIcon=document.getElementById("buttonIcon");
function showMessage(text,type="error"){message.textContent=text;message.className=`login-message ${type}`;}
function toggle(input,button){button.addEventListener("click",()=>{const visible=input.type==="text";input.type=visible?"password":"text";button.setAttribute("aria-label",visible?"Show password":"Hide password");button.querySelector("i").className=visible?"fa-regular fa-eye":"fa-regular fa-eye-slash";});}
toggle(password,document.getElementById("passwordToggle"));
toggle(confirmPassword,document.getElementById("confirmToggle"));
(async()=>{const session=await window.MIAuth.getCurrentSession();if(!session){showMessage("This password reset link is invalid or has expired. Please request a new reset email.");submit.disabled=true;}})();
form.addEventListener("submit",async event=>{event.preventDefault();showMessage("");const p=password.value;const cp=confirmPassword.value;if(p.length<8){showMessage("Password must be at least 8 characters.");return;}if(p!==cp){showMessage("Passwords do not match.");return;}submit.disabled=true;buttonText.textContent="Updating...";buttonIcon.className="fa-solid fa-spinner fa-spin";try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;showMessage("Password updated successfully. Redirecting to login...","success");setTimeout(async()=>{await client.auth.signOut();window.location.href="login.html";},1200);}catch(error){console.error("Password update error:",error);showMessage(error?.message||"Unable to update password. Please request a new reset link.");submit.disabled=false;buttonText.textContent="Update Password";buttonIcon.className="fa-solid fa-check";}});
</script>
</body>
</html>
