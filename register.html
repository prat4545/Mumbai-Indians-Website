<div class="login-decoration decoration-one"></div>

<div class="login-container">

    <div class="login-brand">

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <div class="login-logo">
            <img src="images/logo.png" alt="Mumbai Indians Logo">
        </div>

        <p class="brand-tag">#ONEFAMILY</p>

        <h1>Create Account</h1>

        <p>
            Join the Mumbai Indians One Family.
        </p>

    </div>


    <form class="login-form" id="registerForm">

        <div class="input-group">

            <label for="name">Full Name</label>

            <div class="input-box">

                <i class="fa-regular fa-user"></i>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label for="email">Email Address</label>

            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label for="mobile">Mobile Number</label>

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label for="password">Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('password', this)"
                    aria-label="Show password">

                    <i class="fa-regular fa-eye"></i>

                </button>

            </div>

        </div>


        <div class="input-group">

            <label for="confirmPassword">Confirm Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('confirmPassword', this)"
                    aria-label="Show password">

                    <i class="fa-regular fa-eye"></i>

                </button>

            </div>

        </div>


        <label class="remember register-terms">

            <input type="checkbox" id="terms" required>

            <span>
                I agree to the Terms & Conditions
            </span>

        </label>


        <button type="submit" class="login-submit">

            Create Account

            <i class="fa-solid fa-arrow-right"></i>

        </button>


        <div class="divider">
            <span>OR</span>
        </div>


        <p class="signup-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </form>

</div>

<script>
const SUPABASE_URL = "https://ukksxlhopvemunyibusg.supabase.co";
const SUPABASE_KEY = "sb_publishable_0hFYgocoBicqr-nAMRuXYw_Zrecb0Qo";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function togglePassword(id, button) {

    const password = document.getElementById(id);
    const icon = button.querySelector("i");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }
}


document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const terms = document.getElementById("terms").checked;

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    if (!terms) {
        alert("Please accept the Terms & Conditions.");
        return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: name,
                mobile: mobile
            }
        }
    });

    if (error) {
        alert(error.message);
        return;
    }

    if (!data.user) {
        alert("Registration could not be completed.");
        return;
    }

    const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
            id: data.user.id,
            full_name: name,
            email: email,
            mobile: mobile
        });

    if (profileError) {
        alert("Account created, but profile could not be saved: " + profileError.message);
        return;
    }

    alert("Account created successfully!");

    window.location.href = "login.html";

});
</script>
