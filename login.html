<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mumbai Indians fan website login">
<title>Login | Mumbai Indians</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="login-page">
<div class="login-decoration decoration-one"></div><div class="login-decoration decoration-two"></div>
<div class="login-container">
<div class="login-brand">
<a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
<div class="login-logo"><img src="images/logo.png" alt="Mumbai Indians Logo"></div>
<p class="brand-tag">#ONEFAMILY</p><h1>Welcome Back</h1><p>Login to continue your Mumbai Indians experience.</p>
</div>
<form class="login-form" id="loginForm">
<div class="input-group"><label for="email">Email Address</label><div class="input-box"><i class="fa-regular fa-envelope"></i><input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required></div></div>
<div class="input-group"><label for="password">Password</label><div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
<div class="form-options"><label class="remember"><input type="checkbox" id="rememberMe"><span>Remember me</span></label><a href="#" id="forgotPassword">Forgot password?</a></div>
<div id="loginMessage" class="login-message" aria-live="polite"></div>
<button type="submit" class="login-submit" id="loginSubmit"><span id="loginButtonText">Login</span><i class="fa-solid fa-arrow-right" id="loginButtonIcon"></i></button>
<div class="divider"><span>OR</span></div><p class="signup-text">Don't have an account? <a href="register.html">Create Account</a></p>
</form></div></div>
<script>
const client=window.MIAuth.client;
const form=document.getElementById("loginForm"),email=document.getElementById("email"),password=document.getElementById("password"),toggle=document.getElementById("passwordToggle"),remember=document.getElementById("rememberMe"),submit=document.getElementById("loginSubmit"),buttonText=document.getElementById("loginButtonText"),buttonIcon=document.getElementById("loginButtonIcon"),message=document.getElementById("loginMessage"),forgot=document.getElementById("forgotPassword");
function showMessage(text,type="error"){message.textContent=text;message.className=`login-message ${type}`;} function clearMessage(){message.textContent="";message.className="login-message";}
toggle.addEventListener("click",()=>{const visible=password.type==="text";password.type=visible?"password":"text";toggle.setAttribute("aria-label",visible?"Show password":"Hide password");toggle.querySelector("i").className=visible?"fa-regular fa-eye":"fa-regular fa-eye-slash";});
const savedEmail=localStorage.getItem("mi_saved_email");if(savedEmail){email.value=savedEmail;remember.checked=true;}
(async()=>{const session=await window.MIAuth.getCurrentSession();if(session)window.location.href="account.html";})();
form.addEventListener("submit",async event=>{event.preventDefault();clearMessage();const e=email.value.trim().toLowerCase(),p=password.value;if(!e){showMessage("Please enter your email address.");email.focus();return;}if(!p){showMessage("Please enter your password.");password.focus();return;}if(remember.checked)localStorage.setItem("mi_saved_email",e);else localStorage.removeItem("mi_saved_email");submit.disabled=true;buttonText.textContent="Logging in...";buttonIcon.className="fa-solid fa-spinner fa-spin";try{const{data,error}=await client.auth.signInWithPassword({email:e,password:p});if(error)throw error;if(!data?.user)throw new Error("Login failed. Please try again.");showMessage("Login successful. Redirecting...","success");setTimeout(()=>window.location.href=window.MIAuth.getSafeRedirect("index.html"),700);}catch(error){console.error("Login Error:",error);const text=(error.message||"").toLowerCase();showMessage(text.includes("invalid login credentials")?"Incorrect email or password.":text.includes("email not confirmed")?"Please confirm your email before logging in.":"Unable to login. Please try again.");submit.disabled=false;buttonText.textContent="Login";buttonIcon.className="fa-solid fa-arrow-right";}});
forgot.addEventListener("click",async event=>{event.preventDefault();clearMessage();const e=email.value.trim().toLowerCase();if(!e){showMessage("Enter your email address first, then click Forgot password.");email.focus();return;}try{const{error}=await client.auth.resetPasswordForEmail(e,{redirectTo:`${window.location.origin}/reset-password.html`});if(error)throw error;showMessage("Password reset instructions have been sent to your email.","success");}catch(error){console.error("Password Reset Error:",error);showMessage("Unable to send password reset email. Please try again.");}});
</script></body></html>
