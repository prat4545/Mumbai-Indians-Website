<div class="login-decoration decoration-one"></div>

<div class="login-container">

    <div class="login-brand">

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <div class="login-logo">
            <img src="images/logo.png" alt="Mumbai Indians Logo">
        </div>

        <p class="brand-tag">#ONEFAMILY</p>

        <p>

    <form class="login-form">

        <div class="input-group">

            <label for="email">Email Address</label>

            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label for="password">Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Show password">

                    <i class="fa-regular fa-eye"></i>

                </button>

            </div>

        </div>


        <div class="form-options">

            <label class="remember">

                <input type="checkbox">

                <span>Remember me</span>

            </label>

            <a href="#">Forgot password?</a>

        </div>


        <button type="submit" class="login-submit">

            Login

            <i class="fa-solid fa-arrow-right"></i>

        </button>


        <div class="divider">

    </form>

```

</div>

<script>

function togglePassword() {

    const password = document.getElementById("password");
    const icon = document.querySelector(".password-toggle i");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

}


const SUPABASE_URL = "https://ukksxlhopvemunyibusg.supabase.co";
const SUPABASE_KEY = "sb_publishable_0hFYgocoBicqr-nAMRuXYw_Zrecb0Qo";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


document.querySelector(".login-form").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert(error.message);
        return;
    }

    if (!data.user) {
        alert("Login failed. Please try again.");
        return;
    }

    alert("Login successful!");

    window.location.href = "index.html";

});

</script>
</body>
