<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mumbai Indians fan website login">
<title>Login | Mumbai Indians</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="login-page">
<div class="login-decoration decoration-one"></div>
<div class="login-decoration decoration-two"></div>
<div class="login-container">
<div class="login-brand">
<a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
<div class="login-logo"><img src="images/logo.png" alt="Mumbai Indians Logo"></div>
<p class="brand-tag">#ONEFAMILY</p>
<h1>Welcome Back</h1>
<p>Login to continue your Mumbai Indians experience.</p>
</div>
<form class="login-form" id="loginForm">
<div class="input-group">
<label for="email">Email Address</label>
<div class="input-box"><i class="fa-regular fa-envelope"></i><input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required></div>
</div>
<div class="input-group">
<label for="password">Password</label>
<div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
</div>
<div class="form-options">
<label class="remember"><input type="checkbox" id="rememberMe"><span>Remember me</span></label>
<a href="#" id="forgotPassword">Forgot password?</a>
</div>
<div id="loginMessage" class="login-message" aria-live="polite"></div>
<button type="submit" class="login-submit" id="loginSubmit"><span id="loginButtonText">Login</span><i class="fa-solid fa-arrow-right" id="loginButtonIcon"></i></button>
<div class="divider"><span>OR</span></div>
<p class="signup-text">Don't have an account? <a href="register.html">Create Account</a></p>
</form>
</div>
</div>
<script>
const client = window.MIAuth.client;
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");
const rememberMe = document.getElementById("rememberMe");
const loginSubmit = document.getElementById("loginSubmit");
const loginButtonText = document.getElementById("loginButtonText");
const loginButtonIcon = document.getElementById("loginButtonIcon");
const loginMessage = document.getElementById("loginMessage");
const forgotPassword = document.getElementById("forgotPassword");

function getRedirectPage(){ return window.MIAuth.getSafeRedirect("index.html"); }
function showMessage(message,type="error"){ loginMessage.textContent=message; loginMessage.className=`login-message ${type}`; }
function clearMessage(){ loginMessage.textContent=""; loginMessage.className="login-message"; }

passwordToggle.addEventListener("click",()=>{
 const visible=passwordInput.type==="text";
 passwordInput.type=visible?"password":"text";
 passwordToggle.setAttribute("aria-label",visible?"Show password":"Hide password");
 passwordToggle.querySelector("i").className=visible?"fa-regular fa-eye":"fa-regular fa-eye-slash";
});

const savedEmail=localStorage.getItem("mi_saved_email");
if(savedEmail){emailInput.value=savedEmail;rememberMe.checked=true;}

(async()=>{
 const session=await window.MIAuth.getCurrentSession();
 if(session) window.location.href="account.html";
})();

loginForm.addEventListener("submit",async event=>{
 event.preventDefault(); clearMessage();
 const email=emailInput.value.trim().toLowerCase(); const password=passwordInput.value;
 if(!email){showMessage("Please enter your email address.");emailInput.focus();return;}
 if(!password){showMessage("Please enter your password.");passwordInput.focus();return;}
 if(rememberMe.checked) localStorage.setItem("mi_saved_email",email); else localStorage.removeItem("mi_saved_email");
 loginSubmit.disabled=true; loginButtonText.textContent="Logging in..."; loginButtonIcon.className="fa-solid fa-spinner fa-spin";
 try{
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error) throw error;
  if(!data?.user) throw new Error("Login failed. Please try again.");
  showMessage("Login successful. Redirecting...","success");
  setTimeout(()=>window.location.href=getRedirectPage(),700);
 }catch(error){
  console.error("Login Error:",error);
  let message="Unable to login. Please try again.";
  const text=(error.message||"").toLowerCase();
  if(text.includes("invalid login credentials")) message="Incorrect email or password.";
  else if(text.includes("email not confirmed")) message="Please confirm your email before logging in.";
  showMessage(message); loginSubmit.disabled=false; loginButtonText.textContent="Login"; loginButtonIcon.className="fa-solid fa-arrow-right";
 }
});

forgotPassword.addEventListener("click",async event=>{
 event.preventDefault(); clearMessage();
 const email=emailInput.value.trim().toLowerCase();
 if(!email){showMessage("Enter your email address first, then click Forgot password.");emailInput.focus();return;}
 try{
  const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:`${window.location.origin}/login.html`});
  if(error) throw error;
  showMessage("Password reset instructions have been sent to your email.","success");
 }catch(error){ console.error("Password Reset Error:",error); showMessage("Unable to send password reset email. Please try again."); }
});
</script>
</body>
</html>
