<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Mumbai Indians</title>
<link rel="stylesheet" href="css/store.css">
<link rel="stylesheet" href="css_style.css">
<style>
.checkout-wrap{max-width:1100px;margin:50px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px}.checkout-card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.checkout-card h1,.checkout-card h2{margin-top:0}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dce5;border-radius:8px;font:inherit}.field textarea{min-height:100px;resize:vertical}.checkout-btn{width:100%;border:0;border-radius:9px;padding:14px;background:#f5b800;color:#071d49;font-weight:800;cursor:pointer}.checkout-btn:disabled{opacity:.6;cursor:not-allowed}.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.empty{padding:30px;text-align:center}.message{margin:0 0 18px;padding:12px;border-radius:8px;display:none}.message.error{display:block;background:#fff0f0;color:#a40000}.message.success{display:block;background:#effcf3;color:#126b2f}@media(max-width:760px){.checkout-wrap{grid-template-columns:1fr;margin:25px auto}.checkout-card{padding:20px}}
</style>
</head>
<body>
<header class="navbar"><a class="logo" href="index.html">MUMBAI INDIANS</a><nav id="mainNav"><a href="index.html">Home</a><a href="matches.html">Matches</a><a href="squad.html">Squad</a><a href="about.html">About</a><a href="store.html">Store</a><a class="login-btn" href="login.html">Login</a></nav></header>
<main class="checkout-wrap">
<section class="checkout-card"><h1>Checkout</h1><p id="message" class="message" role="alert"></p><form id="checkoutForm" novalidate><div class="field"><label for="name">Full Name</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" required></div><div class="field"><label for="address">Address</label><textarea id="address" name="address" autocomplete="street-address" required></textarea></div><div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required></div><div class="field"><label for="pincode">Pincode</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" required></div><button id="placeOrderBtn" class="checkout-btn" type="submit">Place Order</button></form></section>
<aside class="checkout-card"><h2>Order Summary</h2><div id="summary"></div></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script src="js/checkout.js"></script>
</body></html>
