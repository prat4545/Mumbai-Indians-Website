<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Tickets | Mumbai Indians</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.booking-header{background:linear-gradient(135deg,#004ba8,#00245f);color:white;padding:28px 7%}.booking-header a{color:white;text-decoration:none;font-size:14px}.booking-header h1{margin-top:18px;font-size:34px}.booking-container{width:90%;max-width:1100px;margin:40px auto;display:grid;grid-template-columns:1.3fr .7fr;gap:25px}.booking-card,.summary-card{background:white;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.match-info{border-bottom:1px solid #e5e9f0;padding-bottom:22px;margin-bottom:25px}.match-info h2{color:#004ba8;margin-bottom:10px}.match-info p{margin:8px 0;color:#657083}.match-info i{width:22px;color:#004ba8}.form-group{margin-bottom:22px}.form-group label{display:block;font-weight:700;margin-bottom:9px}select,input{width:100%;padding:13px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px;outline:none}select:focus,input:focus{border-color:#004ba8}.ticket-option{border:1px solid #dfe4ec;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.2s}.ticket-option:hover{border-color:#004ba8;transform:translateY(-1px)}.ticket-option.active{border:2px solid #004ba8;background:#f1f7ff}.ticket-option strong{display:block;margin-bottom:5px}.ticket-option span{color:#667085;font-size:14px}.ticket-option.sold-out{opacity:.55;cursor:not-allowed}.quantity-row{display:flex;align-items:center;gap:15px}.quantity-row button{width:42px;height:42px;border:none;border-radius:9px;background:#004ba8;color:white;font-size:20px;cursor:pointer}.quantity-row button:disabled{opacity:.5;cursor:not-allowed}.quantity-row input{width:70px;text-align:center}.summary-card h2{color:#004ba8;margin-bottom:22px}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #edf0f4}.summary-row span:first-child{color:#667085}.summary-total{display:flex;justify-content:space-between;margin-top:22px;font-size:22px;font-weight:800}.confirm-btn{width:100%;margin-top:25px;padding:15px;border:none;border-radius:11px;background:#f5b800;color:#111;font-size:16px;font-weight:800;cursor:pointer}.confirm-btn:hover{background:#e5aa00}.confirm-btn:disabled{opacity:.6;cursor:not-allowed}.message{margin-top:18px;padding:13px;border-radius:9px;display:none;font-size:14px}.message.success{display:block;background:#e8f7ed;color:#176b35}.message.error{display:block;background:#fff0f0;color:#b42318}.loading,.empty{text-align:center;padding:30px;color:#667085}@media(max-width:800px){.booking-container{grid-template-columns:1fr}.booking-header h1{font-size:27px}}
</style>
</head>
<body>
<header class="booking-header"><a href="matches.html"><i class="fa-solid fa-arrow-left"></i> Back to Matches</a><h1>Book Mumbai Indians Tickets</h1></header>
<main class="booking-container">
<section class="booking-card"><div id="loadingMessage" class="loading">Loading match details...</div><div id="bookingContent" style="display:none"><div class="match-info"><h2 id="matchTitle">Mumbai Indians vs Opponent</h2><p><i class="fa-regular fa-calendar"></i><span id="matchDate">Date</span></p><p><i class="fa-regular fa-clock"></i><span id="matchTime">Time</span></p><p><i class="fa-solid fa-location-dot"></i><span id="matchVenue">Venue</span></p></div><div class="form-group"><label>Choose Ticket Category</label><div id="ticketOptions">Loading tickets...</div></div><div class="form-group"><label for="quantity">Number of Tickets</label><div class="quantity-row"><button type="button" id="minusBtn" aria-label="Decrease quantity">−</button><input type="number" id="quantity" value="1" min="1" max="10" inputmode="numeric"><button type="button" id="plusBtn" aria-label="Increase quantity">+</button></div></div></div></section>
<aside class="summary-card"><h2>Booking Summary</h2><div class="summary-row"><span>Ticket</span><strong id="summaryTicket">-</strong></div><div class="summary-row"><span>Price</span><strong id="summaryPrice">₹0</strong></div><div class="summary-row"><span>Quantity</span><strong id="summaryQuantity">1</strong></div><div class="summary-total"><span>Total</span><span id="summaryTotal">₹0</span></div><button type="button" class="confirm-btn" id="confirmBookingBtn" disabled><i class="fa-solid fa-ticket"></i> Confirm Booking</button><div id="message" class="message" role="status"></div></aside>
</main>
<script>
(() => {
"use strict";
const auth=window.MIAuth,client=auth?.client;
const params=new URLSearchParams(location.search),matchId=params.get("match_id");
let match=null,tickets=[],selectedTicket=null;
const $=id=>document.getElementById(id);
const loading=$("loadingMessage"),content=$("bookingContent"),options=$("ticketOptions"),quantity=$("quantity"),confirm=$("confirmBookingBtn");
function message(text,type="error"){const box=$("message");box.textContent=text;box.className=`message ${type}`;}
function safe(value){return String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
async function initialize(){
 if(!auth||!client){message("Authentication service is unavailable.");loading.style.display="none";return;}
 if(!matchId||!/^[0-9]+$/.test(matchId)){loading.style.display="none";message("No valid match selected. Please return to Matches.");return;}
 const user=await auth.requireAuth("login.html");if(!user)return;
 await Promise.all([loadMatch(),loadTickets()]);
}
async function loadMatch(){try{const{data,error}=await client.from("matches").select("*").eq("id",matchId).single();if(error||!data)throw error||new Error();match=data;$("matchTitle").textContent=`Mumbai Indians vs ${data.opponent||"Opponent"}`;$("matchDate").textContent=data.match_date||"Date TBA";$("matchTime").textContent=data.match_time||"Time TBA";$("matchVenue").textContent=`${data.venue||"Venue TBA"}${data.city?", "+data.city:""}`;loading.style.display="none";content.style.display="block";}catch(e){console.error(e);loading.style.display="none";message("Unable to load match details. Please try again.");}}
async function loadTickets(){const{data,error}=await client.from("tickets").select("*").eq("match_id",Number(matchId)).order("price",{ascending:true});if(error){console.error(error);options.innerHTML="<div class='empty'>Unable to load ticket categories.</div>";return;}tickets=data||[];renderTickets();}
function renderTickets(){if(!tickets.length){options.innerHTML="<div class='empty'>Tickets are not available for this match yet.</div>";return;}options.innerHTML="";tickets.forEach(ticket=>{const available=Math.max(0,Number(ticket.available_seats)||0),el=document.createElement("div");el.className=`ticket-option${available===0?" sold-out":""}`;el.setAttribute("role","button");el.setAttribute("tabindex",available?"0":"-1");el.innerHTML=`<strong>${safe(ticket.category||"Ticket")}${available===0?" — SOLD OUT":""}</strong><span>₹${Number(ticket.price||0).toLocaleString("en-IN")} · ${available} seats available</span>`;if(available){el.addEventListener("click",()=>selectTicket(ticket,el));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectTicket(ticket,el);}});}options.appendChild(el);});}
function selectTicket(ticket,el){selectedTicket=ticket;document.querySelectorAll(".ticket-option").forEach(x=>x.classList.remove("active"));el.classList.add("active");const max=Math.min(Math.max(0,Number(ticket.available_seats)||0),10);quantity.max=String(max);if(Number(quantity.value)>max)quantity.value=max;updateSummary();confirm.disabled=max<1;}
function updateSummary(){let q=Math.floor(Number(quantity.value)||1);if(selectedTicket){q=Math.max(1,Math.min(q,Math.min(Number(selectedTicket.available_seats)||0,10)));}else q=Math.max(1,Math.min(q,10));quantity.value=q;$("summaryQuantity").textContent=q;const price=selectedTicket?Number(selectedTicket.price)||0:0;$("summaryTicket").textContent=selectedTicket?.category||"-";$("summaryPrice").textContent=`₹${price.toLocaleString("en-IN")}`;$("summaryTotal").textContent=`₹${(price*q).toLocaleString("en-IN")}`;}
$("minusBtn").addEventListener("click",()=>{quantity.value=Math.max(1,(Number(quantity.value)||1)-1);updateSummary();});
$("plusBtn").addEventListener("click",()=>{const max=Number(quantity.max)||10;quantity.value=Math.min(max,(Number(quantity.value)||1)+1);updateSummary();});
quantity.addEventListener("input",updateSummary);
confirm.addEventListener("click",async()=>{if(!selectedTicket){message("Please select a ticket category.");return;}const q=Number(quantity.value);if(!Number.isInteger(q)||q<1){message("Please enter a valid quantity.");return;}if(q>Number(selectedTicket.available_seats)){message("Not enough seats available. Please refresh and try again.");return;}confirm.disabled=true;confirm.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Booking...';try{const{data,error}=await client.rpc("create_ticket_booking",{p_match_id:Number(matchId),p_ticket_id:selectedTicket.id,p_quantity:q});if(error)throw error;message(`Booking confirmed! Reference: ${safe(data?.booking_reference||"Created")}`,"success");confirm.innerHTML='<i class="fa-solid fa-check"></i> Booking Confirmed';setTimeout(()=>location.href="account.html",1600);}catch(error){console.error("Booking Error:",error);message(error?.message||"Unable to complete booking. Please try again.");confirm.disabled=false;confirm.innerHTML='<i class="fa-solid fa-ticket"></i> Confirm Booking';}});
initialize();
})();
</script>
</body></html>
